# agent-harness's committed spec — the per-worktree environment adoption
# signal. Written by the onboarding skill; docs/wt.md is the reference doc
# and docs/wt-decision-record.md records why each choice below was made.
#
# This repo runs as a docker compose stack: one `harness` service holding the
# web UI, the /api endpoints and the /mcp launch server, plus a Vite dev
# server run on the host against it. A worktree therefore needs its own
# compose project (which carries its volume and network with it) and its own
# two ports.
#
# It replaces `harness worktree`, this repo's own allocator, whose registry
# lived at ~/.deepseek-harness/worktrees.json. See docs/wt-decision-record.md,
# "What the import moved".
version: 1
app: agent-harness

# Where a worktree of this repository goes — the same place Claude Code's own
# `isolation: "worktree"` puts one, so the manual flow and the automatic one
# land together. `.claude/worktrees/` is already gitignored, and this is where
# the retired allocator put them too, so no existing tree has to move.
worktrees:
  path: ".claude/worktrees/{slug}"

# Eight concurrent harness stacks. Each slot is a container, a named volume
# and a workspace root, so the ceiling is set by what the machine will carry
# rather than by the port space.
slots:
  max: 8

resources:
  # The harness service's published port: the web UI, /api/... and /mcp all
  # arrive here. docker-compose.yml publishes it as
  # 127.0.0.1:${HARNESS_HTTP_PORT}:8080, and `harness serve` run directly on
  # the host binds it as DEEPSEEK_HTTP_ADDR.
  - type: port
    name: harness_http
  # The Vite dev server's own port (web/vite.config.ts). Independent of
  # harness_http: the dev server reaches the API through a proxy target built
  # from HARNESS_HTTP_PORT, not by port arithmetic, so the two need no fixed
  # relationship.
  - type: port
    name: vite
  # The compose project. It is the single most valuable resource here: the
  # project name namespaces the containers, the `_default` network and the
  # `harness-data` volume that holds this worktree's whole SQLite store, so
  # isolating it isolates all four at once. Slot in the name as well as slug
  # keeps `docker ps` legible and keeps two slots of one slug disjoint.
  - type: namespace
    name: compose
    kind: compose
    template: "{app}-{slug}-{slot}"
    files: [docker-compose.yml]
  # The workspace root: one directory per session id, holding that run's
  # clones. It lives inside the worktree because docker-compose.yml mounts it
  # at the same absolute path on both sides of the mount — the host's daemon
  # resolves a bind source on the host, so a session running docker inside its
  # own clone can only name paths that mean the same thing to both
  # (docs/WORKTREES.md, "Path parity"). No seed block, so it always starts
  # empty: another worktree's sessions are that worktree's, and the directory
  # is already gitignored.
  - type: state-path
    name: workspaces
    template: "{worktree}/workspaces/"

# Ports no worktree of this repository may be allocated.
#
# 8080 and 5173 are the main checkout's own committed defaults — slot 0 keeps
# docker-compose.yml's and vite.config.ts's values, so nothing changes for
# anyone who never makes a worktree.
#
# 8180 is deepseek-harness-prod, the production stack co-resident on this
# machine (docker-compose.prod.yml). It also holds a host-global reservation
# in the band ledger, which is what stops a *different* app allocating it;
# this line is what stops this one.
reserved:
  ports: [8080, 5173, 8180]

# The hand-authored half of the shared block: what a worktree reaches outside
# itself. A session working here — human or agent — reads this out of its own
# descriptor, which is the point of writing it down.
shared:
  - name: "the host docker socket"
    impact: >-
      mounted into every harness container regardless of worktree
      (docker-compose.yml); a session in `full` permission mode controls the
      one host daemon, and can reach any other worktree's containers through
      it. Isolating this would mean Docker-in-Docker per worktree — out of
      scope, and CLAUDE.md's docker socket rule is what governs it instead
  - name: "the deepseek-harness-prod stack"
    impact: >-
      fixed on 127.0.0.1:8180 with its own compose project, volume and
      workspace root. Never allocated to a worktree and never torn down by
      this tooling; it holds a host-global band reservation as well as the
      `reserved:` line above
  - name: "harness-unity-state (docker volume)"
    impact: >-
      the Unity CLI's sign-in state and download cache, named fixedly in
      scripts/unity-shim.sh rather than scoped to a compose project. Every
      worktree's `unity` calls share one signed-in session; concurrent reads
      are harmless, and `unity auth login` in one worktree is visible in all
      of them
  - name: "harness-unity:latest (docker image)"
    impact: >-
      one host-level image both stacks and every worktree reach with
      `docker run --rm`; scripts/build.sh rebuilds it in place, so a worktree
      that rebuilds it changes what every other worktree's `unity` runs
  - name: "the DeepSeek account and the GitHub App installation"
    impact: >-
      each worktree holds its own copy of the API key and the App private key
      in its own settings table, but they name one DeepSeek account and one
      installation. Rate limits, spend and App installation tokens are shared
      in reality no matter how the keys are stored
  - name: "the Go module cache and the npm cache"
    impact: >-
      content-addressed and read-mostly; shared on purpose, because isolating
      them would multiply every worktree's setup time for no benefit

# The reaper's allowlist: the only binaries the coordinator may signal if one
# is found holding this worktree's allocated ports. `harness` is `harness
# serve` run directly on the host; `node` is the Vite dev server.
#
# Docker is deliberately absent. A port published by compose is held by
# com.docker.backend, one process serving every container on this machine —
# signalling it would take down the production stack and every other
# worktree. Containers are stopped by the compose teardown, never by the
# reaper.
reaper:
  binaries: [harness, node]

hooks:
  # The frontend's dependencies, which live in the tree. The container builds
  # its own copy (Dockerfile's `web` stage), so this is for `npm run dev` and
  # for the frontend tests scripts/build.sh runs.
  install:
    run: npm --prefix web ci
    timeout: 10m
  build:
    run: docker compose -p {compose} build
    timeout: 30m
  start:
    run: docker compose -p {compose} up -d --wait
    timeout: 10m
  # The credentials. A fresh worktree's store is inside its own compose
  # volume, so it starts with no DeepSeek key and no GitHub App key and can
  # neither run anything nor clone anything private. This copies them from a
  # stack that already has them, after start because the volume does not
  # exist until compose has run once.
  seed:
    run: bash scripts/wt-seed.sh
    timeout: 2m
  # Namespace-independent on purpose: the check runs inside the harness
  # container against its own loopback, so it works whether wt runs on the
  # host or inside a container, and needs no curl on the machine running wt.
  health:
    run: docker compose -p {compose} exec -T harness wget --spider -q http://127.0.0.1:8080/api/queue
    timeout: 60s

emit:
  descriptor:
    filename: wt-env.json
    format: json
  # The .env managed block. Everything downstream flows from here:
  # docker-compose.yml's ${VAR:-default} substitutions, config.LoadDotEnv for
  # `harness serve` on the host, and vite.config.ts's loadEnv of the repo
  # root. seed: true carries the main checkout's own unmanaged .env content
  # (model overrides and the like) into a new worktree.
  env:
    path: .env
    seed: true
    keys:
      COMPOSE_PROJECT_NAME: "{compose}"
      HARNESS_HTTP_PORT: "{harness_http}"
      HARNESS_VITE_PORT: "{vite}"
      DEEPSEEK_HTTP_ADDR: "127.0.0.1:{harness_http}"
      DEEPSEEK_HARNESS_BASE_URL: "http://127.0.0.1:{harness_http}"
      DEEPSEEK_HARNESS_PUBLIC_URL: "http://127.0.0.1:{harness_http}"
      DEEPSEEK_WORKSPACE_ROOT: "{workspaces}"
      HARNESS_WORKSPACES: "{workspaces}"

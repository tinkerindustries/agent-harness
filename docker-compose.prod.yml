# The production deployment on this machine, kept apart from the dev stack in
# docker-compose.yml so development can rebuild, restart and `down -v` its own
# stack without touching a harness that is mid-run.
#
# The isolation is the project name below: it gives this stack its own
# containers, its own network and its own volumes. Nothing here is shared with
# the dev project except the docker daemon and the host ports, and the ports
# are deliberately different.
#
# Unlike docker-compose.yml these services never build. They run
# deepseek-harness:prod, a tag that scripts/promote.sh moves onto an image
# built from a clean checkout. A dev rebuild therefore cannot change what
# production is running; only an explicit promote can.
#
# Ports and paths are written out rather than interpolated. `docker compose`
# reads .env from this directory for substitution regardless of which -f it
# was given, so a ${VAR} here would silently pick up the dev stack's values.
# Container environment comes from .env.prod, named explicitly below.
#
# ${PWD} and ${HOME} are the two exceptions, and only because the rule's
# hazard does not reach them: the shell's environment wins over .env, and
# neither name is one the dev stack sets. They are unavoidable here — the
# mounts below have to name an absolute host path, and that path is different
# on every machine, so it cannot be written out. Run compose from the
# repository root, which scripts/prod.sh does.
name: deepseek-harness-prod

services:
  harness:
    image: deepseek-harness:prod
    env_file:
      # Production's own credentials and model settings. Separate from .env so
      # an edit made while developing does not reach this stack.
      - path: .env.prod
        required: true
    environment:
      # The default binds loopback, unreachable from outside the container.
      # The published port below keeps it loopback-only on the host.
      DEEPSEEK_HTTP_ADDR: 0.0.0.0:8080
      DEEPSEEK_DATA_DIR: /data
      # The same path the mount below uses on both sides — see the note there.
      DEEPSEEK_WORKSPACE_ROOT: ${HARNESS_WORKSPACES_PROD:-/Users/Shared/harness-workspaces-prod}
      # The harness service also serves /mcp on the published port below;
      # transcript links the MCP tools return point at what a browser on the
      # host can actually reach.
      DEEPSEEK_HARNESS_PUBLIC_URL: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      # Production runs get their workspaces here, never mixed with the dev
      # stack's.
      #
      # Source and target are the same absolute path for the reason
      # docker-compose.yml sets out at length: the socket below makes this a
      # client of the host's daemon, which resolves a bind source on the host,
      # so a session that runs docker compose inside its own clone can only be
      # understood if the path it names is a host path.
      #
      # The default sits outside the checkout so a production path carries no
      # operator home directory or repository name — it is quoted in the
      # opening message of every run, in the session list, and in exported
      # transcripts (docs/wt.md, "Path parity"). Override with
      # HARNESS_WORKSPACES_PROD; it must stay a real host path the daemon will
      # share, and moving it leaves earlier runs' workspaces where they are.
      - ${HARNESS_WORKSPACES_PROD:-/Users/Shared/harness-workspaces-prod}:${HARNESS_WORKSPACES_PROD:-/Users/Shared/harness-workspaces-prod}
      - harness-data:/data
      # The host's docker daemon, for sessions that build or run containers.
      # A session in full permission mode can do anything to the host through
      # this socket, including mounting the host's filesystem into a
      # container it starts.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/queue"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # serve drains in-flight runs on SIGTERM rather than cutting them off.
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  harness-data:

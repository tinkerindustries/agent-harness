# A broker for the Go suite alone. The integration tests delete the WORK and
# RESULTS streams in their cleanup and share the harness-workers durable, so
# pointing them at the deployment in docker-compose.yml makes the two fight:
# the running pool consumes test requests and rejects them against its own
# workspace roots.
name: deepseek-harness-test

services:
  nats:
    image: nats:2.10-alpine
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      # Loopback only, and off the default so it clears both an unrelated
      # project on 4222 and the deployment stack's own override.
      - "127.0.0.1:${HARNESS_TEST_NATS_PORT:-4422}:4222"
    # Stream state never outlives the container, so a run cannot inherit
    # messages a previous run left unacked.
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

services:
  nats:
    image: nats:2.10-alpine
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      # Host ports are overridable because a machine may already run NATS on the
      # defaults. Set NATS_CLIENT_PORT and NATS_MONITOR_PORT in .env if so.
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  harness:
    build:
      context: .
    depends_on:
      nats:
        condition: service_healthy
    env_file:
      # Supplies DEEPSEEK_API_KEY, GITHUB_TOKEN, and any model overrides.
      # The environment block below wins over it for the container-specific
      # values.
      - path: .env
        required: false
    environment:
      # .env's NATS_URL points at the published host port, which does not
      # exist inside the network. Reach the broker by service name instead.
      NATS_URL: nats://nats:4222
      # The default binds loopback, unreachable from outside the container.
      # The published port below keeps it loopback-only on the host.
      DEEPSEEK_HTTP_ADDR: 0.0.0.0:8080
      DEEPSEEK_DATA_DIR: /data
      DEEPSEEK_WORKSPACE_ROOT: /workspaces
    ports:
      - "127.0.0.1:${HARNESS_HTTP_PORT:-8080}:8080"
    volumes:
      # Each run gets a directory of its own here, named for its session id
      # and holding the clones the request asked for.
      - ${HARNESS_WORKSPACES:-./workspaces}:/workspaces
      - harness-data:/data
      # The host's docker daemon, for sessions that build or run containers.
      # A session in full permission mode can do anything to the host through
      # this socket, including mounting the host's filesystem into a
      # container it starts.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/queue"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # serve drains in-flight runs on SIGTERM rather than cutting them off.
    stop_grace_period: 60s
    restart: unless-stopped

  mcp:
    build:
      context: .
    command: ["mcp"]
    depends_on:
      nats:
        condition: service_healthy
      # Not a hard requirement to start — see cmd/harness/mcp.go's own
      # startup check — but the streams and the read-only API this service
      # depends on both come from harness, so there is nothing useful for
      # it to do before harness is healthy.
      harness:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NATS_URL: nats://nats:4222
      # The harness service by name, reachable inside the compose network;
      # unlike DEEPSEEK_HTTP_ADDR's published port, a browser on the host
      # cannot resolve this name, which is what DEEPSEEK_HARNESS_PUBLIC_URL
      # below is for.
      DEEPSEEK_HARNESS_BASE_URL: http://harness:8080
      DEEPSEEK_HARNESS_PUBLIC_URL: http://localhost:${HARNESS_HTTP_PORT:-8080}
      DEEPSEEK_MCP_ADDR: 0.0.0.0:8090
    ports:
      # This port starts sessions that run Bash as root inside the
      # workspace mount (docs/DESIGN.md's MCP launch server, "Safety").
      # Loopback only, same reasoning as the harness service's own port.
      - "127.0.0.1:${HARNESS_MCP_PORT:-8090}:8090"
    restart: unless-stopped

volumes:
  nats-data:
  harness-data:

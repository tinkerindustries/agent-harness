services:
  harness:
    build:
      context: .
    env_file:
      # Supplies GITHUB_TOKEN and any model overrides. The DeepSeek API key
      # is not an environment variable: it lives in the harness's SQLite
      # settings table and is set from the settings screen, or with
      # `PUT /api/settings/deepseek.api_key`.
      # The environment block below wins over .env for the container-specific
      # values.
      - path: .env
        required: false
    environment:
      # The default binds loopback, unreachable from outside the container.
      # The published port below keeps it loopback-only on the host.
      DEEPSEEK_HTTP_ADDR: 0.0.0.0:8080
      DEEPSEEK_DATA_DIR: /data
      # The same path the mount below uses on both of its sides — see the
      # note there. A session's workspace is therefore addressed by its host
      # path everywhere: in this process, in the paths it hands the model,
      # and in any docker command a session runs.
      DEEPSEEK_WORKSPACE_ROOT: ${HARNESS_WORKSPACES:-${PWD}/workspaces}
      # The host path of the worktree registry, for a `docker compose` a
      # session runs inside this container: ${HOME} there is /root, so a
      # nested compose interpolating it would ask the host for
      # /root/.deepseek-harness, which is not the host's registry. This
      # carries the host's own path through so the nested mount finds it.
      # The one value from this block a session is meant to inherit; the
      # entrypoint drops the rest of .env's compose controls before any
      # session can see them (scripts/docker-entrypoint.sh).
      HARNESS_REGISTRY_DIR: ${HARNESS_REGISTRY_DIR:-${HOME}/.deepseek-harness}
      # Transcript links the MCP tools return are built from this URL, so a
      # browser on the host can follow them. The harness service also serves
      # /mcp on the published port below, so this is the same origin a caller
      # already uses.
      DEEPSEEK_HARNESS_PUBLIC_URL: http://localhost:${HARNESS_HTTP_PORT:-8080}
    ports:
      - "127.0.0.1:${HARNESS_HTTP_PORT:-8080}:8080"
    volumes:
      # Each run gets a directory of its own here, named for its session id
      # and holding the clones the request asked for.
      #
      # Source and target are deliberately the same absolute path. The docker
      # socket below makes this container a client of the *host's* daemon, and
      # a bind mount's source is resolved by that daemon, on the host. Mounted
      # at /workspaces, a session that ran `docker compose up` inside its own
      # clone asked the host to bind /workspaces/sess-…/<repo>, a path that
      # exists nowhere on the host — "mounts denied: the path … is not shared
      # from the host", which is what stopped an agent running this repo's own
      # scripts/build.sh (docs/WORKTREES.md, "Path parity"). With the two
      # sides equal, every path a session hands the daemon is already a host
      # path and nested compose needs no translation.
      #
      # ${PWD} is the shell's directory, not the project's, so run compose
      # from the repository root or set HARNESS_WORKSPACES to an absolute
      # path: scripts/build.sh exports it, and `harness worktree init` writes
      # it into each worktree's .env.
      - ${HARNESS_WORKSPACES:-${PWD}/workspaces}:${HARNESS_WORKSPACES:-${PWD}/workspaces}
      - harness-data:/data
      # The host's docker daemon, for sessions that build or run containers.
      # A session in full permission mode can do anything to the host through
      # this socket, including mounting the host's filesystem into a
      # container it starts.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same file `harness worktree init/list/rm/doctor` reads and writes on
      # the host (registryDir() resolves $HOME/.deepseek-harness; the
      # container runs as root, hence /root here). Sharing it is what lets a
      # session's own `harness worktree init -standalone` (docs/WORKTREES.md)
      # allocate a slot the host's real worktrees also see, instead of
      # colliding with them the moment it runs docker compose against the
      # shared daemon above. The target stays /root because that is where the
      # binary in this container looks; HARNESS_REGISTRY_DIR above is what
      # carries the host's path to a nested compose.
      - ${HARNESS_REGISTRY_DIR:-${HOME}/.deepseek-harness}:/root/.deepseek-harness
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/queue"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # serve drains in-flight runs on SIGTERM rather than cutting them off.
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  harness-data:
